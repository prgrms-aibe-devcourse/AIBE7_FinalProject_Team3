services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: grab-backend:local
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/grab
      DB_USERNAME: grab
      DB_PASSWORD: ${DB_PASSWORD:-grab}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      # 기본값을 두지 않는다. .env에 없으면 빈 값이 전달되어 backend가 기동에 실패한다
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      # 메일 본문 링크가 가리키는 프런트엔드 주소. 받는 사람의 브라우저가 여는 주소라 컨테이너 안이 아니라 외부에서 닿는 값을 넣는다
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-grab}
      # 기본값은 Mailpit이다. 컨테이너 안의 localhost는 mailpit이 아니므로 서비스 이름으로 접속한다(docs/MAIL.md)
      # .env에 값을 넣으면 Gmail 등 다른 SMTP로 바꿔 시험할 수 있다
      # :- 를 써서 .env에 빈 값으로 남은 키도 기본값으로 대체한다. 빈 문자열이 넘어가면 Spring 기본값이 적용되지 않는다
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@grab.local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 메일 서버가 없어도 기동은 되지만, 로컬에서 발송 결과를 바로 확인할 수 있게 함께 띄운다
      mailpit:
        condition: service_started

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: grab
      POSTGRES_USER: grab
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grab}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grab -d grab"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # backend와 같은 비밀번호를 쓴다. 비밀번호가 다르거나 한쪽에만 있으면 연결이 실패한다
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-grab}"]
    environment:
      # redis-cli가 이 환경변수로 인증한다(-a 옵션은 비밀번호가 명령줄에 남고 경고를 출력한다)
      REDISCLI_AUTH: ${REDIS_PASSWORD:-grab}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 로컬 개발용 SMTP 서버. 받은 메일을 외부로 보내지 않고 보관해 웹 화면에서 확인한다(docs/MAIL.md)
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      # SMTP. 인증·STARTTLS 없이 받으므로 외부에서 접속하지 못하게 로컬에만 연다
      - "127.0.0.1:1025:1025"
      # 받은 메일 확인용 웹 화면. 인증 코드가 보이므로 로컬에만 연다
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/tmp/loki

  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - "12345:12345"
    volumes:
      - alloy-data:/var/lib/alloy/data

volumes:
  postgres-data:
  redis-data:
  grafana-data:
  loki-data:
  prometheus-data:
  alloy-data:
