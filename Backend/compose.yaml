services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: grab-backend:local
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/grab
      DB_USERNAME: grab
      DB_PASSWORD: ${DB_PASSWORD:-grab}
      # 기본값을 두지 않는다. .env에 없으면 빈 값이 전달되어 backend가 기동에 실패한다
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-grab}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: grab
      POSTGRES_USER: grab
      POSTGRES_PASSWORD: ${DB_PASSWORD:-grab}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grab -d grab"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # backend와 같은 비밀번호를 쓴다. 비밀번호가 다르거나 한쪽에만 있으면 연결이 실패한다
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-grab}"]
    environment:
      # redis-cli가 이 환경변수로 인증한다(-a 옵션은 비밀번호가 명령줄에 남고 경고를 출력한다)
      REDISCLI_AUTH: ${REDIS_PASSWORD:-grab}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/tmp/loki

  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - "12345:12345"
    volumes:
      - alloy-data:/var/lib/alloy/data

volumes:
  postgres-data:
  redis-data:
  grafana-data:
  loki-data:
  prometheus-data:
  alloy-data:
