# 부하테스트 전용 오버라이드. 운영보다 낮은 스펙(AWS t3.nano: vCPU 2개, 0.5GiB, 베이스라인
# CPU 성능 vCPU당 5%)으로 제한해 "이보다 약한 환경에서도 재고 동시성이 깨지지 않는다"는
# 하한선을 검증한다. t3 계열은 nano~large가 전부 vCPU 2개이고 메모리·베이스라인 CPU%만
# 다른 버스터블 인스턴스라, CPU 코어 수는 운영(t3.small)과 같다 — 예전엔 cpus: 1로 잘못
# 제한했었다(2026-10-26 수정). 베이스라인 CPU 크레딧 소진까지는 재현하지 않는다(과한 범위).
# 평소 개발 명령(`docker compose up`)에는 영향 없음. 부하테스트할 때만 명시적으로 합쳐서 쓴다:
#   docker compose -f compose.yaml -f compose.loadtest-nano.yaml up --build
# t3.micro 수준으로 비교하고 싶으면 compose.loadtest-micro.yaml을 대신 합친다(같은 backend
# 서비스를 겹쳐 쓰므로 둘 중 하나만 고른다).
services:
  backend:
    mem_limit: 512m
    # mem_limit만 주면 호스트에 스왑이 켜져 있을 때 도커가 메모리 한도의 2배(최대 1GiB)까지 스왑으로
    # 더 쓰게 허용한다 — 호스트 스왑 설정에 따라 테스트 결과(특히 OOM 여부)가 달라진다.
    # memswap_limit을 mem_limit과 같게 고정해 스왑을 안 쓰게 만들고(운영 t3.nano도 기본 스왑 없음),
    # 호스트 스왑 설정과 무관하게 항상 순수 512MB 한도로 돈다.
    memswap_limit: 512m
    cpus: 2
    environment:
      # JDK17은 컨테이너 메모리 한도의 1/4을 기본 힙으로 잡는다(128MB) — Spring Boot 기동엔 빠듯해
      # 메타스페이스·스레드 스택 몫을 남기고 힙을 명시한다. OOM 발생 시 이 값부터 낮춰 원인을 좁힌다.
      # JAVA_TOOL_OPTS는 이 이미지의 java 런처에 인식되지 않아 무시된다(검증 완료) — JDK_JAVA_OPTIONS를 쓴다.
      JDK_JAVA_OPTIONS: -Xmx384m
