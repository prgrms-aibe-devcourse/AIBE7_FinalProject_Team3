spring:
  application:
    name: GRAB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grab}
    username: ${DB_USERNAME:grab}
    password: ${DB_PASSWORD:grab}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

grab:
  mock-delivery:
    enabled: ${GRAB_MOCK_DELIVERY_ENABLED:false}
  drop-transition:
    enabled: ${GRAB_DROP_TRANSITION_ENABLED:true}
    fixed-delay: 10s
  # 토스페이먼츠 테스트 환경(TECHSTACK.md 4.4). 시크릿 키는 환경변수로만 주입한다.
  toss:
    secret-key: ${TOSS_SECRET_KEY:}
  # Supabase Storage(GR-51). 서비스 롤 키는 RLS를 우회하므로 서버에서만 쓰고 저장소·이미지·로그·응답에 남기지 않는다.
  # 기본값을 빈 값으로 두어 키가 없어도 기동·테스트는 되고, 발급 호출 시점에만 실패한다.
  storage:
    supabase:
      url: ${SUPABASE_URL:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_DROP_IMAGE_BUCKET:drop-images}
      connect-timeout: 3s
      read-timeout: 5s
  auth:
    access-token:
      ttl: 15m
      issuer: grab
      audience: grab-api
      # 서명 키는 저장소에 두지 않는다. 기본값이 없으므로 JWT_SECRET이 없으면 기동하지 않는다
      secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
