spring:
  application:
    name: GRAB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grab}
    username: ${DB_USERNAME:grab}
    password: ${DB_PASSWORD:grab}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

grab:
  mock-delivery:
    enabled: ${GRAB_MOCK_DELIVERY_ENABLED:false}
  # 토스페이먼츠 테스트 환경(TECHSTACK.md 4.4). 시크릿 키는 환경변수로만 주입한다.
  toss:
    secret-key: ${TOSS_SECRET_KEY:}
  auth:
    access-token:
      ttl: 15m
      issuer: grab
      audience: grab-api
      # 서명 키는 저장소에 두지 않는다. 기본값이 없으므로 JWT_SECRET이 없으면 기동하지 않는다
      secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
