spring:
  application:
    name: GRAB

  # 메일 발송 설정은 별도 파일로 분리. 프로필과 무관하게 항상 불러온다
  config:
    import: classpath:application-mail.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grab}
    username: ${DB_USERNAME:grab}
    password: ${DB_PASSWORD:grab}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 기본값은 로컬 compose Redis의 개발용 비밀번호다(DB_PASSWORD와 같은 방식). 운영 값은 환경변수로만 주입한다
      password: ${REDIS_PASSWORD:grab}
      # Lettuce 기본값(연결 10초·명령 60초)이면 Redis가 멈췄을 때 로그인·재발급 요청이 스레드를 오래 붙잡는다
      connect-timeout: 2s
      timeout: 2s

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

grab:
  mock-delivery:
    enabled: ${GRAB_MOCK_DELIVERY_ENABLED:false}
  drop-transition:
    enabled: ${GRAB_DROP_TRANSITION_ENABLED:true}
    fixed-delay: 10s
  # 토스페이먼츠 테스트 환경(TECHSTACK.md 4.4). 시크릿 키는 환경변수로만 주입한다.
  toss:
    secret-key: ${TOSS_SECRET_KEY:}
  # Supabase Storage(GR-51). Secret Key는 RLS를 우회하므로 서버에서만 쓰고 저장소·이미지·로그·응답에 남기지 않는다.
  # 기본값을 빈 값으로 두어 키가 없어도 기동·테스트는 되고, 발급 호출 시점에만 실패한다.
  storage:
    supabase:
      url: ${SUPABASE_URL:}
      secret-key: ${SUPABASE_SECRET_KEY:}
      bucket: ${SUPABASE_DROP_IMAGE_BUCKET:drop-images}
      connect-timeout: 3s
      read-timeout: 5s
  auth:
    access-token:
      ttl: 15m
      issuer: grab
      audience: grab-api
      # 서명 키는 저장소에 두지 않는다. 기본값이 없으므로 JWT_SECRET이 없으면 기동하지 않는다
      secret: ${JWT_SECRET}
    refresh-token:
      # 비활동 14일 + 절대 30일(GR-33 M00-01). idle-ttl이 absolute-ttl보다 길면 기동하지 않는다
      idle-ttl: 14d
      absolute-ttl: 30d
    email-verification:
      # 인증 코드 해시와 Redis 키의 이메일 해시에 함께 쓰는 HMAC 키(GR-61 M00-01). 형식은 JWT_SECRET과 같다
      # 기본값이 없으므로 EMAIL_VERIFICATION_SECRET이 없으면 기동하지 않는다
      hmac-secret: ${EMAIL_VERIFICATION_SECRET}
      # 인증 코드 발송 제한(MEMBER_AUTH 1.2). 이메일은 60초 간격·24시간 10회, IP는 1시간 30회. 구간은 첫 요청부터 세는 고정 구간이다
      send-limit:
        resend-interval: 60s
        email-max-requests: 10
        email-window: 24h
        ip-max-requests: 30
        ip-window: 1h

server:
  # 운영은 Nginx 뒤에서 실행한다. Tomcat이 내부 프록시(사설망 IP)에서 온 요청의 X-Forwarded-For만 믿고
  # request.getRemoteAddr()를 실제 사용자 IP로 바꾼다. 외부에서 직접 보낸 X-Forwarded-For는 무시한다(GR-61 M00-04)
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
