spring:
  application:
    name: GRAB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grab}
    username: ${DB_USERNAME:grab}
    password: ${DB_PASSWORD:grab}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

grab:
  mock-delivery:
    enabled: ${GRAB_MOCK_DELIVERY_ENABLED:false}
  # 토스페이먼츠 테스트 환경(TECHSTACK.md 4.4). 시크릿 키는 환경변수로만 주입한다.
  toss:
    secret-key: ${TOSS_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
