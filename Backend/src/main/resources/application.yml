spring:
  application:
    name: GRAB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grab}
    username: ${DB_USERNAME:grab}
    password: ${DB_PASSWORD:grab}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 기본값은 로컬 compose Redis의 개발용 비밀번호다(DB_PASSWORD와 같은 방식). 운영 값은 환경변수로만 주입한다
      password: ${REDIS_PASSWORD:grab}
      # Lettuce 기본값(연결 10초·명령 60초)이면 Redis가 멈췄을 때 로그인·재발급 요청이 스레드를 오래 붙잡는다
      connect-timeout: 2s
      timeout: 2s

  # 기본값은 로컬 compose Mailpit이다 -> 개발 과정에서 사용하는 가짜 메일 서버
  # 운영 Gmail 계정과 앱 비밀번호는 환경변수로만 주입한다
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          # required를 함께 켜야 서버가 STARTTLS를 제공하지 않을 때 평문으로 내려가 계정 정보를 보내지 않는다
          # 운영 단계에서 true로 전환, STARTTLS -> 평문으로 시작한 연결을 암호화 연결로 바꾸는 방식
          starttls:
            enable: ${MAIL_STARTTLS:false}
            required: ${MAIL_STARTTLS:false}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

grab:
  mock-delivery:
    enabled: ${GRAB_MOCK_DELIVERY_ENABLED:false}
  drop-transition:
    enabled: ${GRAB_DROP_TRANSITION_ENABLED:true}
    fixed-delay: 10s
  # 토스페이먼츠 테스트 환경(TECHSTACK.md 4.4). 시크릿 키는 환경변수로만 주입한다.
  toss:
    secret-key: ${TOSS_SECRET_KEY:}
  auth:
    access-token:
      ttl: 15m
      issuer: grab
      audience: grab-api
      # 서명 키는 저장소에 두지 않는다. 기본값이 없으므로 JWT_SECRET이 없으면 기동하지 않는다
      secret: ${JWT_SECRET}
    refresh-token:
      # 비활동 14일 + 절대 30일(GR-33 M00-01). idle-ttl이 absolute-ttl보다 길면 기동하지 않는다
      idle-ttl: 14d
      absolute-ttl: 30d

management:
  # SMTP 장애가 health 전체를 DOWN으로 만들어 메일과 무관한 요청까지 막지 않도록 메일 헬스 체크는 끈다(TECHSTACK 4.3)
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
