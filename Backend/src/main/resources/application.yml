spring:
  application:
    name: GRAB

  # 메일 발송 설정은 별도 파일로 분리. 프로필과 무관하게 항상 불러온다
  config:
    import: classpath:application-mail.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grab}
    username: ${DB_USERNAME:grab}
    password: ${DB_PASSWORD:grab}
    hikari:
      data-source-properties:
        # PostgreSQL 오류 상세(Detail: Failing row contains ..., Key (email)=(...))를 예외 메시지에 붙이지 않는다.
        # 처리하지 않은 DB 오류의 ERROR 로그에 이메일·비밀번호 해시 등 행 값이 남지 않게 한다. 오류 종류와 제약 이름은 남는다(GR-29, 팀 결정)
        # DB_URL이 URL을 통째로 바꾸므로 URL 파라미터가 아니라 여기에 둔다
        logServerErrorDetail: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 기본값은 로컬 compose Redis의 개발용 비밀번호다(DB_PASSWORD와 같은 방식). 운영 값은 환경변수로만 주입한다
      password: ${REDIS_PASSWORD:grab}
      # Lettuce 기본값(연결 10초·명령 60초)이면 Redis가 멈췄을 때 로그인·재발급 요청이 스레드를 오래 붙잡는다
      connect-timeout: 2s
      timeout: 2s
      # 운영(Aiven Valkey)은 TLS 필수. 로컬 compose Redis는 평문이라 기본값 false를 유지한다
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  # @Scheduled 작업(DROP 상태 전환·결제 배치·배송 단계 진행)이 서로를 기다리지 않도록 스레드를 작업 수보다 넉넉히 둔다.
  # 기본값 1이면 결제 배치의 PG 지연이 DROP 판매 시작 전환까지 늦춘다(TECHSTACK.md 1장 Scheduling).
  task:
    scheduling:
      pool:
        size: 4

  flyway:
    enabled: true
    locations: classpath:db/migration

  # 수요 분석 설명 생성 LLM(GR-146, TECHSTACK.md 1.3). 기본값 none이면 모델 빈을 만들지 않아 키 없이도 기동하고,
  # 설명 요청은 DISABLED로 응답한다. 켜려면 DEMAND_LLM_PROVIDER=google-genai와 GEMINI_API_KEY를 함께 넣는다.
  # 임베딩(GR-147)·이미지 생성은 쓰지 않는다
  ai:
    model:
      chat: ${DEMAND_LLM_PROVIDER:none}
      embedding:
        text: none
      image: none
    google:
      genai:
        # Gemini Developer API 키(Google AI Studio 발급). 환경변수로만 주입하고 저장소·로그에 남기지 않는다
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}
            temperature: 0.2
    # Spring AI 기본값은 실패 시 최대 10회(2초부터 5배씩 늘어나는 간격) 재시도한다. 서비스가 시간 제한으로 결과를 버려도
    # 재시도가 뒤에서 계속 돌며 전용 풀 작업자를 몇 분씩 붙잡아 이후 요청까지 실패시켰다. 설명은 재시도하지 않으므로(DEMAND.md 3.4) 끈다
    # (max-attempts는 첫 호출을 뺀 재시도 횟수다)
    retry:
      max-attempts: 0

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # 판매자 신청 서류 업로드(GR-91). 버킷의 허용 크기 제한과 서버 검증값을 같게 유지한다
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

grab:
  # GR-110 구독 기반. SSE endpoint·전송 경로는 후속 단계에서 연결한다.
  stock-stream:
    coalesce-window: 1s
    heartbeat-interval: 15s
    connection-lifetime: 10m
    send-timeout: 5s
    max-pending-drops: 100
    max-drop-ids: 100
    max-connections: 200
    max-connections-per-ip: 20
    connect-rate-window: 60s
    connect-rate-max: 30
    retry-after: 60s
    # 활성 연결이 없고 요청 창이 만료되면 제거한다. 임의 IP로 추적 메모리가 무한 증가하지 않게 한다.
    max-tracked-ips: 10000
  # 메일 본문 등 서버가 만드는 링크가 가리키는 프런트엔드 주소. 기본값은 로컬 Vite 개발 서버다
  web:
    base-url: ${WEB_BASE_URL:http://localhost:5173}
  mock-delivery:
    enabled: ${GRAB_MOCK_DELIVERY_ENABLED:false}
    # SHIPPED 이후 배송 단계(집화완료→간선상차→간선하차→배송출발→배송완료) 자동 진행 간격(GR-86)
    stage-interval: ${GRAB_MOCK_DELIVERY_STAGE_INTERVAL:30s}
    poll-interval: ${GRAB_MOCK_DELIVERY_POLL_INTERVAL:10s}
  # 판매자 화면이 수요 분석을 먼저 제안하는 기준(DEMAND.md 1.8)
  demand:
    suggestion:
      min-active-wishes: 30
      hours-before-start: 48
  drop-transition:
    enabled: ${GRAB_DROP_TRANSITION_ENABLED:true}
    fixed-delay: 10s
  # 결제 배치(GR-65·GR-87·GR-88). 끄면 마감이 지난 주문의 재고가 반환되지 않고, 결과를 모르는 결제 취소와 주문을 확정하지 못한 결제의 환불도 요청하지 않는다.
  payment-batch:
    enabled: ${GRAB_PAYMENT_BATCH_ENABLED:true}
    fixed-delay: 10s
  # 토스페이먼츠 테스트 환경(TECHSTACK.md 4.4). 시크릿 키는 환경변수로만 주입한다.
  toss:
    secret-key: ${TOSS_SECRET_KEY:}
  payment:
    # 부하테스트(GR-154, GR-155)에서 토스 샌드박스 대신 MockPaymentGateway를 쓸지. 운영에서는 켜지 않는다.
    mock-gateway:
      enabled: ${GRAB_PAYMENT_MOCK_GATEWAY_ENABLED:false}
      # GR-155 장애 주입 비율(0~1). 전부 기본값 0이면 GR-154처럼 항상 성공하는 기존 동작과 같다.
      confirm-failure-rate: ${GRAB_MOCK_CONFIRM_FAILURE_RATE:0}
      confirm-unknown-rate: ${GRAB_MOCK_CONFIRM_UNKNOWN_RATE:0}
      cancel-unknown-rate: ${GRAB_MOCK_CANCEL_UNKNOWN_RATE:0}
      resolve-delay-seconds: ${GRAB_MOCK_RESOLVE_DELAY_SECONDS:20}
  # 국세청 사업자등록 상태조회(GR-90, SELLER-005). 서비스키가 없으면 검증을 생략하고 PENDING 접수로 넘어간다.
  nts:
    business-registration:
      service-key: ${DATA_GO_KR_SERVICE_KEY:}
  # Supabase Storage(GR-51). Secret Key는 RLS를 우회하므로 서버에서만 쓰고 저장소·이미지·로그·응답에 남기지 않는다.
  # 기본값을 빈 값으로 두어 키가 없어도 기동·테스트는 되고, 발급 호출 시점에만 실패한다.
  storage:
    supabase:
      url: ${SUPABASE_URL:}
      secret-key: ${SUPABASE_SECRET_KEY:}
      drop-images-bucket: ${SUPABASE_DROP_IMAGE_BUCKET:drop-images}
      documents-bucket: ${SUPABASE_SELLER_DOCUMENT_BUCKET:seller-documents}
      profile-images-bucket: ${SUPABASE_PROFILE_IMAGE_BUCKET:profile-images}
      connect-timeout: 3s
      read-timeout: 5s
  # 판매자 서류 봉투 암호화 마스터키(GR-91). Base64 AES-256 키, 기본값 없음(KMS 연동 없음)
  seller:
    document-encryption:
      master-key: ${SELLER_DOCUMENT_ENCRYPTION_MASTER_KEY}
  auth:
    access-token:
      ttl: 15m
      issuer: grab
      audience: grab-api
      # 서명 키는 저장소에 두지 않는다. 기본값이 없으므로 JWT_SECRET이 없으면 기동하지 않는다
      secret: ${JWT_SECRET}
    refresh-token:
      # 비활동 14일 + 절대 30일(GR-33 M00-01). idle-ttl이 absolute-ttl보다 길면 기동하지 않는다
      idle-ttl: 14d
      absolute-ttl: 30d
      # 교체 후 이 기간 안의 옛 토큰 재사용은 세션을 폐기하지 않고 401만 응답한다(GR-35 M00-03). 0이면 유예 없음
      reuse-grace: 10s
    # KAKAO·GOOGLE 소셜 로그인(GR-46). Client ID·Secret은 저장소에 두지 않고 기본값이 없어 값이 없으면 기동하지 않는다.
    # 제공자 콘솔의 Redirect URI는 {백엔드 주소}/api/v1/auth/oauth2/{kakao|google}/callback이다
    oauth2:
      # 콜백 결과(result·error 쿼리)를 받을 프론트엔드 주소. 해시 라우터 경로까지 적는다
      frontend-callback-url: ${OAUTH2_FRONTEND_CALLBACK_URL:http://localhost:5173/#/auth/callback}
      kakao:
        client-id: ${KAKAO_CLIENT_ID}
        client-secret: ${KAKAO_CLIENT_SECRET}
      google:
        client-id: ${GOOGLE_CLIENT_ID}
        client-secret: ${GOOGLE_CLIENT_SECRET}
    email-verification:
      # 인증 코드 해시와 Redis 키의 이메일 해시에 함께 쓰는 HMAC 키(GR-61 M00-01). 형식은 JWT_SECRET과 같다
      # 기본값이 없으므로 EMAIL_VERIFICATION_SECRET이 없으면 기동하지 않는다
      hmac-secret: ${EMAIL_VERIFICATION_SECRET}
      # 인증 코드 발송 제한(MEMBER_AUTH 1.2). 이메일은 60초 간격·24시간 10회, IP는 1시간 30회. 구간은 첫 요청부터 세는 고정 구간이다
      send-limit:
        resend-interval: 60s
        email-max-requests: 10
        email-window: 24h
        ip-max-requests: 30
        ip-window: 1h
  cors:
    # Credential(쿠키) 요청을 허용할 프론트엔드 Origin(GR-44 M00-04). 기본값은 로컬 Vite 개발 서버다.
    # 여러 개는 쉼표로 구분하고 끝에 /를 붙이지 않는다. 운영을 같은 출처로 서비스하면 쓰이지 않는다
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  # 운영은 Nginx 뒤에서 실행한다. Tomcat이 내부 프록시(사설망 IP)에서 온 요청의 X-Forwarded-For만 믿고
  # request.getRemoteAddr()를 실제 사용자 IP로 바꾼다. 외부에서 직접 보낸 X-Forwarded-For는 무시한다(GR-61 M00-04)
  forward-headers-strategy: native

springdoc:
  swagger-ui:
    csrf:
      # Swagger UI의 Try it out이 XSRF-TOKEN 쿠키 값을 X-XSRF-TOKEN 헤더로 보낸다(GR-44 M00-06).
      # 쿠키·헤더 이름은 springdoc 기본값이 명세와 같다. 상태 변경 요청 전에 GET /api/v1/auth/csrf를 먼저 실행한다
      enabled: true
  group-configs:
    - group: category
      packages-to-scan: org.example.grab.domain.category
    - group: dashboard
      packages-to-scan: org.example.grab.domain.dashboard
    - group: demand
      packages-to-scan: org.example.grab.domain.demand
    - group: drop
      packages-to-scan: org.example.grab.domain.drop
    - group: order
      packages-to-scan:
        - org.example.grab.domain.order
        - org.example.grab.domain.shipment
    - group: payment
      packages-to-scan: org.example.grab.domain.payment
    - group: seller
      packages-to-scan: org.example.grab.domain.seller
    - group: user
      packages-to-scan:
        - org.example.grab.domain.user
        - org.example.grab.domain.auth
    - group: wish
      packages-to-scan: org.example.grab.domain.wish

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
