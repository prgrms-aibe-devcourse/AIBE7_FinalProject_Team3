# 테스트 클래스패스에만 있는 설정이다. 기본 application.yml에 덧붙여 읽히고 같은 키만 덮어쓴다.
# src/test/resources/application.yml로 두면 main 설정을 통째로 가리므로 config/ 아래에 둔다.
grab:
  auth:
    access-token:
      # 테스트 전용 JWT 서명 키. 운영·개발 환경에서 절대 사용하지 않는다.
      # 디코딩하면 "grab-test-only-jwt-secret-not-for-production"(44바이트)이다.
      secret: Z3JhYi10ZXN0LW9ubHktand0LXNlY3JldC1ub3QtZm9yLXByb2R1Y3Rpb24=
    # 테스트 전용 소셜 로그인 클라이언트 값(GR-46). 실제 제공자에 등록된 값이 아니며 제공자 응답은 테스트에서 대역한다
    oauth2:
      frontend-callback-url: http://localhost:5173/#/auth/callback
      kakao:
        client-id: test-kakao-client-id
        client-secret: test-kakao-client-secret
      google:
        client-id: test-google-client-id
        client-secret: test-google-client-secret
    email-verification:
      # 테스트 전용 이메일 인증 HMAC 키. 운영·개발 환경에서 절대 사용하지 않는다.
      # 디코딩하면 "grab-test-only-email-verification-secret"(40바이트)이다.
      hmac-secret: Z3JhYi10ZXN0LW9ubHktZW1haWwtdmVyaWZpY2F0aW9uLXNlY3JldA==
  # DROP 이미지 imageUrl 검증(GR-51)이 공개 URL 접두사를 만들 때 쓰는 테스트 값.
  storage:
    supabase:
      url: https://project.supabase.co
      bucket: drop-images
  # 테스트 전용 서류 암호화 마스터키(GR-91). 디코딩하면 "grab-test-only-doc-encrypt-key32"(32바이트)다.
  seller:
    document-encryption:
      master-key: Z3JhYi10ZXN0LW9ubHktZG9jLWVuY3J5cHQta2V5MzI=
