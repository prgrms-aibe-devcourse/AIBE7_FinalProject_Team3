services:
  backend-blue:
    image: ${IMAGE:-ghcr.io/prgrms-aibe-devcourse/aibe7-finalproject-team3-backend}:${IMAGE_TAG:-latest}
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  backend-green:
    image: ${IMAGE:-ghcr.io/prgrms-aibe-devcourse/aibe7-finalproject-team3-backend}:${IMAGE_TAG:-latest}
    env_file: .env
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
