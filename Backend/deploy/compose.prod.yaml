services:
  backend-blue:
    image: ${IMAGE:-ghcr.io/prgrms-aibe-devcourse/aibe7-finalproject-team3-backend}:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend-green:
    image: ${IMAGE:-ghcr.io/prgrms-aibe-devcourse/aibe7-finalproject-team3-backend}:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    env_file: .env
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
