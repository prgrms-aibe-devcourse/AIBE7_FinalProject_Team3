name: Backend CI

on:
  pull_request:
    branches: [deploy, main]
  push:
    branches: [deploy, main]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and build image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # pgvector 확장(GR-147) 포함 이미지. Testcontainers 이미지(TestcontainersConfiguration)와 같게 둔다
        image: pgvector/pgvector:0.8.2-pg18-trixie
        env:
          POSTGRES_DB: grab
          POSTGRES_USER: grab
          POSTGRES_PASSWORD: grab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grab -d grab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/grab
      DB_USERNAME: grab
      DB_PASSWORD: grab

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # deploy 브랜치 룰셋이 이 job 이름("Test and build image")을 필수 체크로
      # 요구한다. 워크플로 트리거 자체를 Backend/** 경로로 거르면 Frontend 전용
      # PR에서는 체크가 아예 생기지 않아 머지가 영구히 막힌다(GitHub Docs
      # "Troubleshooting required status checks" 권장 패턴). 그래서 트리거는
      # 항상 열어 job이 실행되게 하고, Backend 변경이 없을 때는 아래 스텝만
      # 건너뛰어 빠르게 통과시킨다.
      - name: Backend 변경 여부 확인
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Backend/**'
              - '.github/workflows/backend-ci.yml'

      - name: Set up Java
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            Backend/*.gradle*
            Backend/gradle/wrapper/gradle-wrapper.properties

      - name: Run backend tests
        if: steps.filter.outputs.backend == 'true'
        working-directory: Backend
        run: ./gradlew test --no-daemon

      - name: Set up Docker Buildx
        if: steps.filter.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        if: steps.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: grab-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
