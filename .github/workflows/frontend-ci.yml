name: Frontend CI

on:
  pull_request:
    branches: [deploy, main]
    paths:
      - Frontend/**
      - .github/workflows/frontend-ci.yml
  push:
    branches: [deploy, main]
    paths:
      - Frontend/**
      - .github/workflows/frontend-ci.yml
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI에서는 git 훅이 필요 없다
env:
  HUSKY: 0

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E and visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 기준 이미지를 만든 환경과 같아야 한다. 버전은 package.json의 @playwright/test와 맞춘다.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            Frontend/playwright-report/
            Frontend/test-results/
          retention-days: 14
